<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Template</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root { --g: #2A3BE0; --ink: #0b0b0b; --mute: #6f6f6f; --s: 1; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
body { background: #fff; font-family: Inter, 'Noto Sans KR', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

.bar { position: fixed; left: 16px; bottom: 16px; z-index: 60; max-width: 560px; background: #111; color: #fff; font-size: 12px; line-height: 1.6; padding: 10px 38px 10px 14px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.bar b { color: #9fb0ff; }
.bar button { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: #aaa; font-size: 18px; cursor: pointer; line-height: 1; }

/* 슬라이드 = 화면 한 장 */
.wrap { height: 100vh; min-height: calc(720px * var(--s)); display: flex; align-items: center; justify-content: center; background: #fff; scroll-snap-align: start; overflow: hidden; }
.fit { width: calc(1280px * var(--s)); height: calc(720px * var(--s)); flex-shrink: 0; }
.slide { position: relative; width: 1280px; height: 720px; background: #fff; overflow: hidden; transform: scale(var(--s)); transform-origin: 0 0; }

/* 진행 바 · 점 내비 */
#progress { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: var(--g); transform: scaleX(0); transform-origin: 0 0; z-index: 70; }
#dots { position: fixed; right: 12px; top: 50%; translate: 0 -50%; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
#dots a { position: relative; display: block; width: 6px; height: 6px; border-radius: 3px; background: #c9c9c9; transition: height .3s, background .3s; }
#dots a.on { height: 22px; background: var(--g); }
#dots a::after { content: attr(data-l); position: absolute; right: 14px; top: 50%; translate: 0 -50%; white-space: nowrap; font-size: 11px; font-weight: 700; color: var(--g); background: #fff; padding: 2px 8px; border: 1px solid var(--g); border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity .2s; }
#dots a:hover::after { opacity: 1; }

/* 모션 규칙 — 모든 장이 같은 규칙으로 움직인다
   · 속도 3단계: 빠름 .3s(장식) / 보통 .6s(글자) / 느림 .9s(사진 · 영상 · 세로 제목)
   · 곡선 1개(--e), 이동 거리 1개(--rise, 아래에서 위로)
   · 등장 순서는 역할 순서로 고정(아래 스크립트의 ROLE_DELAY): 제목 0 → 사진 120 → 본문 240 → 표 줄 360+50씩 → 장식 500ms
   · 이미 본 장(.seen)으로 돌아오면 순서 없이 .3s 만에 한꺼번에 */
:root { --e: cubic-bezier(.2,.7,.2,1); --fast: .3s; --base: .6s; --slow: .9s; --rise: 16px; }
.slide > * { transition: opacity var(--base) var(--e) var(--d,0ms), translate var(--base) var(--e) var(--d,0ms), scale var(--base) var(--e) var(--d,0ms); }
.slide > .ph { clip-path: inset(0); translate: 0 calc((var(--p,.5) - .5) * 30px); transition: clip-path var(--slow) var(--e) var(--d,0ms), translate .15s linear; }
.slide > .vt { clip-path: inset(0); translate: 0 calc((var(--p,.5) - .5) * -30px); transition: clip-path var(--slow) var(--e) var(--d,0ms), translate .15s linear; }
.slide > .vid, .slide > .vid-print { transition: opacity var(--slow) var(--e) var(--d,0ms), translate var(--slow) var(--e) var(--d,0ms); }
.slide > .ring { transition: opacity var(--fast) var(--e) var(--d,0ms); }
.line-h, .line-v { transform-origin: 0 0; }
.row, .tl, .mr { transition: opacity var(--base) var(--e) var(--d,0ms), translate var(--base) var(--e) var(--d,0ms); }

.wrap:not(.in) .slide > .t:not(.vt) { opacity: 0; translate: 0 var(--rise); }
.wrap:not(.in) .slide > .vt { clip-path: inset(0 0 100% 0); }
.wrap:not(.in) .slide > .ph { clip-path: inset(0 100% 0 0); }
.wrap:not(.in) .slide > .ring { opacity: 0; }
.wrap:not(.in) .slide > .line-h { scale: 0 1; }
.wrap:not(.in) .slide > .line-v { scale: 1 0; }
.wrap:not(.in) .slide > .sm.a:not(.t) { opacity: 0; }
.wrap:not(.in) .row, .wrap:not(.in) .tl, .wrap:not(.in) .mr { opacity: 0; translate: 0 var(--rise); }
.wrap.seen .slide > *, .wrap.seen .row, .wrap.seen .tl, .wrap.seen .mr { --d: 0ms !important; transition-duration: var(--fast) !important; }
@media (prefers-reduced-motion: reduce) {
  .slide > *, .row, .tl, .mr { transition: none !important; }
  .wrap .slide > *, .wrap .row, .wrap .tl, .wrap .mr { opacity: 1 !important; translate: none !important; scale: none !important; clip-path: none !important; }
}

.a { position: absolute; }
.t:focus { outline: 1px dashed var(--g); outline-offset: 3px; }

.vt { writing-mode: vertical-rl; text-orientation: sideways; transform: rotate(180deg); font-weight: 900; font-size: 92px; line-height: .92; letter-spacing: -3px; top: 0; bottom: 0; white-space: nowrap; }
.ht { font-weight: 900; font-size: 64px; line-height: .95; letter-spacing: -2px; }
.lead { color: var(--g); font-weight: 800; font-size: 15px; line-height: 1.35; }
.p { font-size: 14px; line-height: 1.6; color: #111; }
.big { font-size: 21px; line-height: 1.45; font-weight: 500; letter-spacing: -.3px; }
.sm { font-size: 10px; color: var(--mute); line-height: 1.5; }
.num { font-weight: 900; font-size: 46px; letter-spacing: -2px; line-height: 1; }

.ph { position: absolute; background: #d6d6d6 center / cover no-repeat; filter: grayscale(1); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #8a8a8a; font-size: 12px; }
.ph:not(.has-img)::after { content: attr(data-l) ' ＋ 사진 추가'; text-align: center; padding: 8px; }
/* 본문 링크: 파란 강조색과 겹치지 않게 진한 굵은 글씨 + 검은 밑줄 + 밑줄 아래 은은한 그림자 띠 */
.slide a:not(.gh) { color: #111 !important; font-weight: 700; text-decoration: underline; text-decoration-color: #111; text-decoration-thickness: 1.5px; text-underline-offset: 3px; background-image: linear-gradient(to bottom, transparent 70%, rgba(0,0,0,.10) 70%, rgba(0,0,0,.03) 100%); padding: 0 1px; border-radius: 2px; transition: background-color .2s; }
.slide a:not(.gh):hover { background-color: rgba(0,0,0,.05); }
.slide > .ph.shot { clip-path: inset(-60px); }
.ph.shot { filter: none; border-radius: 6px; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 6px 14px rgba(0,0,0,.10), 0 18px 40px rgba(0,0,0,.14); }
.scap { font-size: 11px; line-height: 1.5; color: #444; }
.scap b { color: var(--g); font-weight: 800; margin-right: 6px; }
.code b { display: block; font-size: 13px; font-weight: 900; margin-bottom: 4px; }
.code .sm { display: block; font-size: 11px; color: #555; margin-bottom: 8px; line-height: 1.5; }
.code pre { background: #0f1222; color: #e6e8f5; font: 10.5px/1.55 ui-monospace, Menlo, monospace; padding: 12px 14px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.code pre i { color: #8a93b8; font-style: normal; }
.webc .sm { display: block; font-size: 12.5px; color: #444; line-height: 1.7; }
.webc .k { display: block; font-size: 11px; font-weight: 800; color: var(--g); letter-spacing: .04em; margin: 14px 0 2px; }
.webc .meta { display: block; margin-top: 16px; padding-top: 10px; border-top: 1px solid #e5e5e5; font-size: 11px; line-height: 1.8; color: #777; }
.webc .meta a { font-weight: 600 !important; }
.ring { position: absolute; width: 22px; height: 22px; border: 1.5px solid var(--g); border-radius: 50%; }
.line-v { position: absolute; width: 0; border-left: 1px solid var(--g); }
.line-h { position: absolute; height: 0; border-top: 1px solid var(--g); }
.doodle { position: absolute; overflow: visible; pointer-events: none; z-index: 1; }
.doodle path { fill: none; stroke: var(--g); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; opacity: .85; transition: stroke-dashoffset 1.1s cubic-bezier(.6,0,.3,1) var(--d,0ms); }
.wrap:not(.in) .doodle path { stroke-dashoffset: 1; }
.doodle.slow path { transition-duration: 2s; }

.mr { display: flex; gap: 16px; border-top: 1px solid #ddd; padding: 8px 0; font-size: 13px; }
.mr b { width: 56px; font-weight: 700; flex-shrink: 0; }
.mr span { color: #444; }
.row { display: flex; align-items: baseline; gap: 18px; border-bottom: 1px solid #111; padding: 12px 0; }
.row .n { font-weight: 900; font-size: 22px; width: 40px; }
.row .nm { font-weight: 800; font-size: 22px; flex: 1; letter-spacing: -.5px; }
.row .ty { font-size: 12px; color: var(--mute); width: 380px; }
.tl { display: flex; gap: 20px; padding: 9px 0; border-top: 1px solid #ddd; }
.tl b { width: 80px; font-size: 12px; flex-shrink: 0; }
.tl i { font-style: normal; font-weight: 800; width: 150px; font-size: 13px; flex-shrink: 0; }
.tl span { font-size: 12px; color: #444; }
.gh { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; background: var(--g); color: #fff; font-size: 10px; font-weight: 700; text-decoration: none; border-radius: 999px; z-index: 3; }
.gh svg { width: 10px; height: 10px; }
.gh:hover { background: #1F2EC0; }
.wrap:not(.in) .slide > .gh { opacity: 0; translate: 0 var(--rise); }
.cv h4.skh2 { margin-top: 20px; padding-top: 10px; border-top: 2px solid #111; font-size: 12px; }
.cv .tl.sk { border-top: 0; padding: 3px 0; gap: 20px; }
.cv .tl.sk b { width: 70px; color: #111; font-weight: 800; font-size: 12px; }
.cv .tl.sk span { flex: 1; font-size: 12px; color: #666; line-height: 1.7; }
.cv .tl.sk strong { color: #111; font-weight: 800; }
.cv .tl.sk i.it { display: inline-block; width: auto; font-style: normal; font-weight: 400; font-size: inherit; white-space: nowrap; }
.cv .tl.sk em { font-style: normal; color: #c4c4c4; margin: 0 7px; }
.cv h4 { font-size: 11px; font-weight: 800; color: var(--g); margin: 8px 0 2px; letter-spacing: .02em; }
.cv h4:first-child { margin-top: 0; }
.cv .tl { padding: 4px 0; }
.cv .tl b { width: 150px; font-weight: 600; color: #444; white-space: nowrap; }
.cv .tl i { width: 235px; }
.cv .tl i.wide { width: auto; flex: 1; white-space: nowrap; }
.cv .tl i.wide span { display: block; margin-top: 2px; font-weight: 400; font-size: 11.5px; color: #555; white-space: normal; }

.st h4 { font-size: 11px; font-weight: 800; color: var(--g); margin: 0 0 4px; letter-spacing: .02em; }
.st .tl { padding: 8px 0; }
.st .tl b { width: 84px; }
.st .tl i { width: 120px; }
.shotslider .ss-view { position: relative; height: 350px; border-radius: 6px; overflow: visible; background: #f3f3f3; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 6px 14px rgba(0,0,0,.10), 0 18px 40px rgba(0,0,0,.14); }
.shotslider .ss-view img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 6px; object-fit: cover; object-position: top center; opacity: 0; transition: opacity var(--base) var(--e); }
.shotslider .ss-view img.on { opacity: 1; }
.shotslider .ss-btn { position: absolute; top: 50%; translate: 0 -50%; width: 30px; height: 30px; border: 1px solid #e3e3e3; border-radius: 50%; background: #fff; color: #111; font-size: 18px; line-height: 28px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.2); opacity: .85; transition: opacity var(--fast); z-index: 2; }
.shotslider .ss-btn:hover { opacity: 1; }
.shotslider .ss-btn.prev { left: 14px; } .shotslider .ss-btn.next { right: 14px; }
.shotslider .ss-btn { background: rgba(255,255,255,.92); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
/* 평소엔 자동 슬라이드, 마우스를 올리면(또는 키보드로 닿으면) 화살표가 나타나고 멈춘다 */
.shotslider .ss-btn { opacity: 0; pointer-events: none; transition: opacity .25s ease; }
.shotslider:hover .ss-btn, .shotslider:focus-within .ss-btn { opacity: .95; pointer-events: auto; }
@media (hover: none) { .shotslider .ss-btn { opacity: .85; pointer-events: auto; } }
.shotslider .ss-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; font-size: 10.5px; color: var(--mute); }
.shotslider .ss-dots { display: flex; gap: 5px; }
.shotslider .ss-dots i { display: block; width: 6px; height: 6px; border-radius: 3px; background: #ccc; cursor: pointer; transition: width var(--fast) var(--e), background var(--fast); }
.shotslider .ss-dots i.on { width: 18px; background: var(--g); }
.slide > .shotslider { transition: opacity var(--slow) var(--e) var(--d,0ms), translate var(--slow) var(--e) var(--d,0ms); }
.wrap:not(.in) .slide > .shotslider { opacity: 0; translate: 0 var(--rise); }
.vid { background: #000; border-radius: 6px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.wrap:not(.in) .slide > .vid { opacity: 0; translate: 0 var(--rise); }
.cat { display: inline-block; vertical-align: middle; margin-right: 8px; padding: 2px 10px; border: 1.5px solid var(--g); border-radius: 999px; background: #fff; color: var(--g); font-size: 10.5px; font-weight: 800; line-height: 1.45; letter-spacing: .02em; }
.row .ty .cat { margin-right: 6px; }
.stage .sm { font-size: 12.5px; color: #444; line-height: 1.6; }
.stage b { display: block; font-size: 11px; color: var(--g); font-weight: 800; margin-bottom: 4px; }
.stage strong { display: block; font-size: 17px; font-weight: 900; margin-bottom: 6px; }
.metric { border-top: 3px solid #111; padding-top: 10px; }
.metric small { display: block; font-size: 11px; color: var(--mute); margin-top: 6px; }

@media print {
  .shotslider .ss-btn { display: none !important; }
  .shotslider .ss-view img:not(.on) { display: none !important; }
  html { scroll-snap-type: none; }
  .bar, #dots, #progress { display: none; }
  .wrap { display: block; height: auto; min-height: 0; overflow: visible; page-break-after: always; }
  .fit { width: 1280px; height: 720px; }
  .slide { transform: none; }
  .doodle path { stroke-dashoffset: 0 !important; transition: none !important; }
  .slide *, .row, .tl, .mr { opacity: 1 !important; translate: none !important; scale: none !important; rotate: none !important; clip-path: none !important; transition: none !important; }
  .ph:not(.has-img)::after { content: ''; }
  @page { size: 1280px 720px; margin: 0; }
}
</style>
</head>
<body>
<div class="bar">
  <b>사용법</b> · 스크롤하면 한 장씩 넘어갑니다 · 글자는 클릭해서 바로 수정, 회색 사진 칸을 클릭하면 이미지 추가(자동 흑백) · <b>[대괄호]</b>는 직접 채울 자리 · 완성 후 Ctrl+P → "PDF로 저장" (여백 없음, 배경 그래픽 켜기) · 수정 내용은 저장되지 않으니 PDF로 먼저 저장하세요.
  <button type="button" onclick="this.parentNode.remove()" aria-label="닫기">×</button>
</div>

<script>
const T = (cls, txt, st) => `<div class="t a ${cls}" style="${st || ''}" contenteditable="true" spellcheck="false">${txt}</div>`;
const P = (st, label, img, pos) => `<div class="ph${img ? ' has-img shot' : ''}" style="${st}${img ? `;background-image:url(${img});background-position:${pos || 'center'}` : ''}" data-l="${label || ''}"></div>`;
// 손그림 낙서 (pathLength=1 → 슬라이드 진입 시 그려지는 모션)
const DOOD = (w, h, paths, st, cls = '') => `<svg class="doodle a ${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="${st}" aria-hidden="true">${paths.map(d => `<path pathLength="1" d="${d}"/>`).join('')}</svg>`;
const OVAL = (st, cls) => DOOD(320, 120, ['M47.8 72.1 L44.7 68.9 L42.4 65.7 L40.9 62.5 L40.3 59.2 L40.5 55.8 L41.5 52.5 L43.5 49.2 L46.2 46.0 L49.8 42.9 L54.2 39.9 L59.5 37.0 L65.4 34.2 L72.1 31.7 L79.4 29.3 L87.4 27.2 L95.9 25.2 L104.9 23.6 L114.3 22.2 L124.0 21.0 L134.1 20.1 L144.4 19.6 L154.8 19.3 L165.2 19.3 L175.7 19.5 L186.0 20.1 L196.2 20.9 L206.1 22.0 L215.8 23.4 L225.0 25.1 L233.8 26.9 L242.1 29.0 L249.9 31.4 L257.0 33.9 L263.5 36.6 L269.3 39.5 L274.3 42.5 L278.5 45.7 L282.0 48.9 L284.6 52.3 L286.4 55.7 L287.3 59.1 L287.4 62.6 L286.5 66.1 L284.8 69.5 L282.2 73.0 L278.8 76.3 L274.5 79.6 L269.4 82.7 L263.5 85.7 L256.9 88.6 L249.6 91.2 L241.5 93.7 L232.9 96.0 L223.7 98.1 L213.9 99.9 L203.8 101.4 L193.2 102.7 L182.3 103.6 L171.2 104.3 L160.0 104.7 L148.7 104.8 L137.4 104.5 L126.2 103.9 L115.1 103.0 L104.4 101.8 L94.0 100.3 L84.0 98.5 L74.5 96.4 L65.5 94.0 L57.3 91.3 L49.7 88.4 L42.9 85.3 L36.9 81.9 L31.8 78.4 L27.5 74.7 L24.3 70.9 L21.9 67.0 L20.6 63.0 L20.2 59.0 L20.9 55.0 L22.5 50.9 L25.1 47.0 L28.6 43.1 L33.1 39.3 L38.5 35.7 L44.7 32.2 L51.7 28.9 L59.5 25.8 L68.0 23.0 L77.2 20.4 L86.9 18.1 L97.2 16.2 L108.0 14.5 L119.1 13.1 L130.5 12.1 L142.2 11.4 L154.0 11.0 L166.0 11.0 L177.9 11.4 L189.8 12.0 L201.5 13.0 L213.0 14.4 L224.1 16.0 L234.9 18.0 L245.2 20.2 L255.0 22.8 L264.2 25.6 L272.7 28.6 L280.5 31.8 L287.5 35.3 L293.6 38.9 L298.8 42.7 L303.0 46.7 L306.3 50.7 L308.6 54.8 L309.8 59.0 L309.9 63.1 L309.0 67.3 L307.0 71.5 L304.0 75.6 L299.9 79.6 L294.8 83.5 L288.6 87.3 L281.6 90.9 L273.7 94.4 L264.9 97.6 L255.3 100.6 L245.0 103.3 L234.1 105.7 L222.6 107.9 L210.7 109.7 L198.4 111.1 L185.8 112.3 L172.9 113.1 L160.0 113.5 L147.1 113.5 L134.2 113.1 L121.5 112.4 L109.0 111.3 L96.9 109.8 L85.2 107.9 L74.1 105.7 L63.5 103.2 L53.6 100.3 L44.4 97.1 L35.9 93.6 L28.4 89.9 L21.7 85.9 L16.0 81.7 L11.2 77.4'], st, cls);
const SPARK_UR = st => DOOD(40, 40, ['M10 30 L18 22', 'M9 19 L12 6', 'M21 33 L34 29'], st);
const SPARK_UL = st => DOOD(40, 40, ['M30 30 L22 22', 'M31 19 L28 6', 'M19 33 L6 29'], st);
const WAVE = (w, st) => DOOD(w, 12, [`M2 7 C${w * .15} 1 ${w * .25} 12 ${w * .38} 6 S${w * .6} 1 ${w * .72} 7 S${w * .9} 10 ${w - 2} 4`], st);
const R = (st) => `<div class="ring" style="${st}"></div>`;
const LV = (st) => `<div class="line-v" style="${st}"></div>`;
const LH = (st) => `<div class="line-h" style="${st}"></div>`;

// 순서: AI NEWSROOM → 나루 우체국 → 만약에 → 콘텐츠 제작(60초 단편영화 · 단편영화 · 라이브커머스) → 웹 제작(쇼핑몰 · 영화 · 도서)
const projects = [
  { n: '01', name: 'AI NEWSROOM', sub: 'AI Newsroom OS · 팀 프로젝트', cat: 'AI 서비스', single: true,
    gh: 'https://github.com/beang66/ai-newsroom-os',
    link: '<a href="https://github.com/beang66/ai-newsroom-os#run-locally" target="_blank" rel="noopener" style="color:var(--g)">Windows 설치형 앱 · 실행 방법</a>',
    period: '2026.09 – 2026.10',

    ['D-6주', '인물 · 세계관 카드', '[캐릭터 소개 이미지 시리즈 · 카드뉴스]'],
    ['D-4주', '참여형 콘텐츠', '[밸런스 게임 · “만약에” 질문 · 댓글 이벤트]'],
    ['D-1주', '시사 반응 숏폼', '[관객 리액션 · 명대사 클립]'],
    ['개봉주', '집중 업로드', '[업로드 주기 · 릴스 · 쇼츠 · 틱톡별 포맷]'],
    ['개봉 후', '아카이빙 · 성과 점검', '[조회 · 저장 · 공유 지표, 콘텐츠 아카이브 정리]']
  ].map(r => `<div class="tl"><b>${r[0]}</b><i>${r[1]}</i><span>${r[2]}</span></div>`).join(''), 'left:150px;top:100px;width:720px') +
  T('lead', '쇼박스 작품 한 편을 정해 숏폼 · 이미지 · 참여형 콘텐츠 일정을 채워 넣으세요.<br><br>[선택한 작품 · 타깃 관객 · 핵심 KPI]', 'left:930px;top:100px;width:290px') +
  P('left:150px;top:560px;width:720px;height:120px', '썸네일 · 홍보 이미지 시안')
);

// 7. THANK YOU
slides.push(
  R('left:1000px;top:36px') + T('num', '26', 'left:1032px;top:26px;font-size:30px;letter-spacing:-1px') +
  T('lead', '읽어주셔서 감사합니다.<br>[한 줄 마무리]', 'left:110px;top:140px;width:300px') +
  T('ht', 'thank<br>you', 'left:560px;top:150px;font-size:96px') +
  P('left:360px;top:400px;width:520px;height:270px', '마무리 이미지') +
  T('sm', '박소현<br>sohyeon1628@gmail.com<br>[포트폴리오 · 영상 링크]', 'left:920px;top:560px;width:260px')
);

const deck = document.getElementById('deck');
const total = slides.length;
slides.forEach((html, i) => {
  const w = document.createElement('div');
  w.className = 'wrap';
  w.id = 's' + (i + 1);
  w.innerHTML = `<div class="fit"><div class="slide">` +
    T('sm', '박소현 · Portfolio', 'left:40px;top:28px;z-index:2') +
    html +
    `<div class="sm a" style="right:40px;top:28px;z-index:2">${String(i + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}</div></div></div>`;
  deck.appendChild(w);
});

// 등장 순서: 모든 장이 같은 역할 순서로 등장한다
const ROLE_DELAY = el =>
  el.matches('.vt, .ht, .lead') ? 0 :                 // ① 제목
  el.matches('.ph, .vid, .vid-print, .shotslider') ? 120 :         // ② 사진 · 영상
  el.matches('.ring, .line-h, .line-v') ? 500 :       // ⑤ 장식
  240;                                                 // ③ 본문
deck.querySelectorAll('.slide').forEach(sl => {
  [...sl.children].forEach(el => el.style.setProperty('--d', ROLE_DELAY(el) + 'ms'));
  sl.querySelectorAll('.row, .tl, .mr').forEach((r, k) => r.style.setProperty('--d', (360 + Math.min(k, 5) * 50) + 'ms'));   // ④ 표 줄
});

// 화면 슬라이더: ‹ › 버튼 · 점 · 3.5초 자동 넘김(마우스를 올리면 멈춤, 장이 보일 때만)
deck.querySelectorAll('.shotslider').forEach(sl => {
  const imgs = [...sl.querySelectorAll('.ss-view img')], dots = [...sl.querySelectorAll('.ss-dots i')];
  const cap = sl.querySelector('.ss-cap'), caps = JSON.parse(sl.dataset.caps);
  let i = 0, timer = null, hover = false;
  const go = n => { i = (n + imgs.length) % imgs.length; imgs.forEach((im, k) => im.classList.toggle('on', k === i)); dots.forEach((d, k) => d.classList.toggle('on', k === i)); cap.textContent = caps[i]; };
  const stop = () => { clearInterval(timer); timer = null; };
  const start = () => { stop(); if (!hover) timer = setInterval(() => go(i + 1), 3500); };
  sl.querySelector('.prev').addEventListener('click', e => { e.stopPropagation(); go(i - 1); start(); });
  sl.querySelector('.next').addEventListener('click', e => { e.stopPropagation(); go(i + 1); start(); });
  dots.forEach((d, k) => d.addEventListener('click', e => { e.stopPropagation(); go(k); start(); }));
  sl.addEventListener('mouseenter', () => { hover = true; stop(); });
  sl.addEventListener('mouseleave', () => { hover = false; if (sl.closest('.wrap').classList.contains('in')) start(); });
  sl._start = start; sl._stop = stop; go(0);
});

// 점 내비
const labels = ['Cover', 'About', 'Strengths', 'Projects',
  ...projects.flatMap(p => (p.group || p.single) ? [p.name] : [p.name, p.name + ' · 결과', ...(p.screens ? [p.name + ' · 화면'] : []), ...(p.extra ? [p.name + ' · 구조'] : []), ...(p.code ? [p.name + ' · 코드'] : [])]), 'Timeline', 'Thank you'];
const dots = document.getElementById('dots');
dots.innerHTML = labels.map((l, i) => `<a href="#s${i + 1}" data-l="${l}" aria-label="${l}"></a>`).join('');
const dotLinks = dots.querySelectorAll('a');

// 슬라이드 진입 시 .in → 모션 재생 (다시 돌아오면 다시 재생)
const wraps = deck.querySelectorAll('.wrap');
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting && e.target.classList.contains('in')) e.target.classList.add('seen');
  e.target.classList.toggle('in', e.isIntersecting);
  e.target.querySelectorAll('video').forEach(v => { if (e.isIntersecting) v.play().catch(() => {}); else v.pause(); });
  e.target.querySelectorAll('.shotslider').forEach(sl => e.isIntersecting ? sl._start() : sl._stop());
  if (e.isIntersecting) {
    const idx = [...wraps].indexOf(e.target);
    dotLinks.forEach((d, i) => d.classList.toggle('on', i === idx));
  }
}), { threshold: 0.55 });
wraps.forEach(w => io.observe(w));

// 스크롤 진행 바 · 패럴랙스
const bar = document.getElementById('progress');
let ticking = false;
function onScroll() {
  const vh = innerHeight;
  const max = document.documentElement.scrollHeight - vh;
  bar.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
  wraps.forEach(w => {
    const r = w.getBoundingClientRect();
    if (r.bottom < -50 || r.top > vh + 50) return;
    w.style.setProperty('--p', Math.max(0, Math.min(1, (vh - r.top) / (vh + r.height))).toFixed(3));
  });
  ticking = false;
}
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });

function fit() {
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  document.documentElement.style.setProperty('--s', s);
  onScroll();
}
fit();
window.addEventListener('resize', fit);
// 인쇄 · PDF: 영상 대신 대표 장면(포스터) 사진을 넣는다(재생 버튼 · 진행 막대가 찍히지 않게)
function swapVideos(toPrint) {
  deck.querySelectorAll('video.vid').forEach(v => {
    let im = v.nextElementSibling && v.nextElementSibling.classList.contains('vid-print') ? v.nextElementSibling : null;
    if (toPrint) {
      if (!im) { im = document.createElement('img'); im.className = 'vid-print a'; im.src = v.poster; im.style.cssText = v.style.cssText + ';object-fit:cover;border-radius:6px'; v.after(im); }
      v.style.display = 'none'; im.style.display = 'block';
    } else if (im) { im.style.display = 'none'; v.style.display = ''; }
  });
}
window.addEventListener('beforeprint', () => { document.documentElement.style.setProperty('--s', 1); swapVideos(true); });
window.addEventListener('afterprint', () => { swapVideos(false); fit(); });

const pick = document.getElementById('pick');
let target = null;
deck.addEventListener('click', e => {
  const ph = e.target.closest('.ph');
  if (ph) { target = ph; pick.click(); }
});
pick.addEventListener('change', () => {
  const f = pick.files[0];
  if (!f || !target) return;
  const r = new FileReader();
  r.onload = () => {
    target.style.backgroundImage = `url(${r.result})`;
    target.classList.add('has-img');
    pick.value = '';
  };
  r.readAsDataURL(f);
});
</script>
