<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Template</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root { --g: #2A3BE0; --ink: #0b0b0b; --mute: #6f6f6f; --s: 1; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
body { background: #fff; font-family: Inter, 'Noto Sans KR', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

.bar { position: fixed; left: 16px; bottom: 16px; z-index: 60; max-width: 560px; background: #111; color: #fff; font-size: 12px; line-height: 1.6; padding: 10px 38px 10px 14px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.bar b { color: #9fb0ff; }
.bar button { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: #aaa; font-size: 18px; cursor: pointer; line-height: 1; }

/* 슬라이드 = 화면 한 장 */
.wrap { height: 100vh; min-height: calc(720px * var(--s)); display: flex; align-items: center; justify-content: center; background: #fff; scroll-snap-align: start; overflow: hidden; }
.fit { width: calc(1280px * var(--s)); height: calc(720px * var(--s)); flex-shrink: 0; }
.slide { position: relative; width: 1280px; height: 720px; background: #fff; overflow: hidden; transform: scale(var(--s)); transform-origin: 0 0; }

/* 진행 바 · 점 내비 */
#progress { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: var(--g); transform: scaleX(0); transform-origin: 0 0; z-index: 70; }
/* 왼쪽 사이드바 내비게이션 */
:root { --sw: 210px; }
body { padding-left: var(--sw); }
.bar { left: calc(var(--sw) + 16px); }
#progress, #dots { display: none !important; }
#side { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sw); z-index: 65; display: flex; flex-direction: column; padding: 30px 18px 22px 22px; background: #fafafa; border-right: 1px solid #ececec; transition: transform .3s var(--e, ease); }
#side .sd-head b { display: block; font-size: 16px; font-weight: 900; letter-spacing: -.3px; color: #111; }
#side .sd-head span { display: block; margin-top: 2px; font-size: 11px; color: var(--mute); }
#sdnav { flex: 1; margin-top: 18px; overflow-y: auto; }
#sdnav h6 { margin: 18px 0 6px; font-size: 10px; font-weight: 800; letter-spacing: .14em; color: #9a9a9a; }
#sdnav a { display: flex; align-items: baseline; gap: 8px; margin-left: -12px; padding: 6px 10px 6px 9px; border-left: 3px solid transparent; border-radius: 0 6px 6px 0; font-size: 13px; line-height: 1.35; color: #555; text-decoration: none; transition: background .2s, color .2s, border-color .2s; }
#sdnav a .n { flex: 0 0 18px; font-size: 10.5px; font-weight: 800; color: #b0b0b0; }
#sdnav a.sub { padding-left: 35px; font-size: 11.5px; color: #888; }
#sdnav a:hover { background: #f0f0f0; color: #111; }
#sdnav a.on { border-left-color: var(--g); background: #eef0ff; color: #111; font-weight: 800; }
#sdnav a.on .n { color: var(--g); }
#side .sd-prog { margin-top: 14px; }
#side .sd-prog .tr { height: 3px; border-radius: 2px; background: #e4e4e4; overflow: hidden; }
#side .sd-prog i { display: block; height: 100%; width: 0; background: var(--g); transition: width .4s var(--e, ease); }
#side .sd-prog span { display: block; margin-top: 6px; font-size: 11px; color: var(--mute); }
#sdtoggle { display: none; position: fixed; left: 12px; top: 12px; z-index: 70; width: 38px; height: 38px; border: 1px solid #ddd; border-radius: 50%; background: #fff; font-size: 17px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
@media (max-width: 900px) {
  :root { --sw: 0px; }
  #side { width: 230px; padding-top: 66px; transform: translateX(-100%); box-shadow: 0 0 30px rgba(0,0,0,.18); }
  body.sd-open #side { transform: none; }
  #sdtoggle { display: block; }
}
#dots { position: fixed; right: 12px; top: 50%; translate: 0 -50%; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
#dots a { position: relative; display: block; width: 6px; height: 6px; border-radius: 3px; background: #c9c9c9; transition: height .3s, background .3s; }
#dots a.on { height: 22px; background: var(--g); }
#dots a::after { content: attr(data-l); position: absolute; right: 14px; top: 50%; translate: 0 -50%; white-space: nowrap; font-size: 11px; font-weight: 700; color: var(--g); background: #fff; padding: 2px 8px; border: 1px solid var(--g); border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity .2s; }
#dots a:hover::after { opacity: 1; }

/* 모션 규칙 — 모든 장이 같은 규칙으로 움직인다
   · 속도 3단계: 빠름 .3s(장식) / 보통 .6s(글자) / 느림 .9s(사진 · 영상 · 세로 제목)
   · 곡선 1개(--e), 이동 거리 1개(--rise, 아래에서 위로)
   · 등장 순서는 역할 순서로 고정(아래 스크립트의 ROLE_DELAY): 제목 0 → 사진 120 → 본문 240 → 표 줄 360+50씩 → 장식 500ms
   · 이미 본 장(.seen)으로 돌아오면 순서 없이 .3s 만에 한꺼번에 */
:root { --e: cubic-bezier(.2,.7,.2,1); --fast: .3s; --base: .6s; --slow: .9s; --rise: 16px; }
.slide > * { transition: opacity var(--base) var(--e) var(--d,0ms), translate var(--base) var(--e) var(--d,0ms), scale var(--base) var(--e) var(--d,0ms); }
.slide > .ph { clip-path: inset(0); translate: 0 calc((var(--p,.5) - .5) * 30px); transition: clip-path var(--slow) var(--e) var(--d,0ms), translate .15s linear; }
.slide > .vt { clip-path: inset(0); translate: 0 calc((var(--p,.5) - .5) * -30px); transition: clip-path var(--slow) var(--e) var(--d,0ms), translate .15s linear; }
.slide > .vid, .slide > .vid-print { transition: opacity var(--slow) var(--e) var(--d,0ms), translate var(--slow) var(--e) var(--d,0ms); }
.slide > .ring { transition: opacity var(--fast) var(--e) var(--d,0ms); }
.line-h, .line-v { transform-origin: 0 0; }
.row, .tl, .mr { transition: opacity var(--base) var(--e) var(--d,0ms), translate var(--base) var(--e) var(--d,0ms); }

.wrap:not(.in) .slide > .t:not(.vt) { opacity: 0; translate: 0 var(--rise); }
.wrap:not(.in) .slide > .vt { clip-path: inset(0 0 100% 0); }
.wrap:not(.in) .slide > .ph { clip-path: inset(0 100% 0 0); }
.wrap:not(.in) .slide > .ring { opacity: 0; }
.wrap:not(.in) .slide > .line-h { scale: 0 1; }
.wrap:not(.in) .slide > .line-v { scale: 1 0; }
.wrap:not(.in) .slide > .sm.a:not(.t) { opacity: 0; }
.wrap:not(.in) .row, .wrap:not(.in) .tl, .wrap:not(.in) .mr { opacity: 0; translate: 0 var(--rise); }
.wrap.seen .slide > *, .wrap.seen .row, .wrap.seen .tl, .wrap.seen .mr { --d: 0ms !important; transition-duration: var(--fast) !important; }
@media (prefers-reduced-motion: reduce) {
  .slide > *, .row, .tl, .mr { transition: none !important; }
  .wrap .slide > *, .wrap .row, .wrap .tl, .wrap .mr { opacity: 1 !important; translate: none !important; scale: none !important; clip-path: none !important; }
}

.a { position: absolute; }
.t:focus { outline: 1px dashed var(--g); outline-offset: 3px; }

.vt { writing-mode: vertical-rl; text-orientation: sideways; transform: rotate(180deg); font-weight: 900; font-size: 92px; line-height: .92; letter-spacing: -3px; top: 0; bottom: 0; white-space: nowrap; }
.ht { font-weight: 900; font-size: 64px; line-height: .95; letter-spacing: -2px; }
.lead { word-break: keep-all; color: var(--g); font-weight: 800; font-size: 15px; line-height: 1.35; }
.p { font-size: 14px; line-height: 1.6; color: #111; }
.big { font-size: 21px; line-height: 1.45; font-weight: 500; letter-spacing: -.3px; }
.sm { font-size: 10px; color: var(--mute); line-height: 1.5; }
.num { font-weight: 900; font-size: 46px; letter-spacing: -2px; line-height: 1; }

.ph { position: absolute; background: #d6d6d6 center / cover no-repeat; filter: grayscale(1); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #8a8a8a; font-size: 12px; }
.ph:not(.has-img)::after { content: attr(data-l) ' ＋ 사진 추가'; text-align: center; padding: 8px; }
/* 본문 링크: 파란 강조색과 겹치지 않게 진한 굵은 글씨 + 검은 밑줄 + 밑줄 아래 은은한 그림자 띠 */
.slide a:not(.gh) { color: #111 !important; font-weight: 700; text-decoration: underline; text-decoration-color: #111; text-decoration-thickness: 1.5px; text-underline-offset: 3px; background-image: linear-gradient(to bottom, transparent 70%, rgba(0,0,0,.10) 70%, rgba(0,0,0,.03) 100%); padding: 0 1px; border-radius: 2px; transition: background-color .2s; }
.slide a:not(.gh):hover { background-color: rgba(0,0,0,.05); }
.slide > .ph.shot { clip-path: inset(-60px); }
.ph.shot { filter: none; border-radius: 6px; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 6px 14px rgba(0,0,0,.10), 0 18px 40px rgba(0,0,0,.14); }
.scap { font-size: 11px; line-height: 1.5; color: #444; }
.scap b { color: var(--g); font-weight: 800; margin-right: 6px; }
.code b { display: block; font-size: 13px; font-weight: 900; margin-bottom: 4px; }
.code .sm { display: block; font-size: 11px; color: #555; margin-bottom: 8px; line-height: 1.5; }
.code pre { background: #0f1222; color: #e6e8f5; font: 10.5px/1.55 ui-monospace, Menlo, monospace; padding: 12px 14px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.code pre i { color: #8a93b8; font-style: normal; }
.webc .sm { display: block; font-size: 12.5px; color: #444; line-height: 1.7; }
.webc .k { display: block; font-size: 11px; font-weight: 800; color: var(--g); letter-spacing: .04em; margin: 14px 0 2px; }
.webc .meta { display: block; margin-top: 16px; padding-top: 10px; border-top: 1px solid #e5e5e5; font-size: 11px; line-height: 1.8; color: #777; }
.webc .meta a { font-weight: 600 !important; }
/* 웹 제작: 한 화면에 사이트 하나 + 미리보기 + 자동 넘김 */
.webstage .ws-main { position: absolute; left: 0; top: 0; width: 640px; height: 400px; border-radius: 6px; background: #f3f3f3; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 6px 14px rgba(0,0,0,.10), 0 18px 40px rgba(0,0,0,.14); overflow: hidden; }
.webstage .ws-img { position: absolute; inset: 0; background-size: cover; background-repeat: no-repeat; opacity: 0; transition: opacity var(--base) var(--e); }
.webstage .ws-img.on { opacity: 1; }
.webstage .ws-thumbs { position: absolute; left: 0; top: 420px; width: 640px; display: flex; gap: 22px; }
.webstage .ws-th { position: relative; flex: 1; height: 96px; padding: 0; border: 0; border-radius: 5px; background-size: cover; background-position: top center; cursor: pointer; opacity: .45; filter: grayscale(.4); box-shadow: 0 0 0 1px rgba(0,0,0,.08); overflow: hidden; transition: opacity var(--fast), filter var(--fast), box-shadow var(--fast); }
.webstage .ws-th:hover { opacity: .8; }
.webstage .ws-th.on { opacity: 1; filter: none; box-shadow: 0 0 0 2px var(--g); }
.webstage .ws-th.next { opacity: .75; filter: none; }
.webstage .ws-th span { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 8px 5px; background: linear-gradient(transparent, rgba(0,0,0,.72)); color: #fff; font-size: 11px; font-weight: 800; text-align: left; }
.webstage .ws-th.next span::before { content: 'NEXT  '; color: #c9d0ff; white-space: pre; }
.webstage .ws-th i { position: absolute; left: 0; top: 0; height: 3px; width: 0; background: var(--g); }
.webstage .ws-th.on i { animation: wsbar var(--ws-t, 5s) linear forwards; }
.webstage.paused .ws-th.on i { animation-play-state: paused; }
@keyframes wsbar { to { width: 100%; } }
.webstage .ws-info { position: absolute; left: 670px; top: 0; width: 470px; height: 516px; }
.webstage .wsi { position: absolute; inset: 0; opacity: 0; translate: 0 8px; pointer-events: none; transition: opacity var(--base) var(--e), translate var(--base) var(--e); word-break: keep-all; }
.webstage .wsi.on { opacity: 1; translate: 0 0; pointer-events: auto; }
.webstage .wsn { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--mute); }
.webstage .wst { display: block; margin: 4px 0 10px; font-size: 24px; font-weight: 900; letter-spacing: -.6px; color: #111; }
.webstage .wsl { display: block; padding: 11px 14px; background: #f2f2f2; font-size: 13.5px; font-weight: 500; line-height: 1.6; color: #222; }
.webstage .k { display: block; margin: 16px 0 4px; font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--g); }
.webstage .sm { display: block; font-size: 13px; font-weight: 400; line-height: 1.6; color: #555; }
.webstage .sm b { font-weight: 800; color: #111; }
.webstage .wsm { margin-top: 18px; border-top: 1px solid #e5e5e5; }
.webstage .wsm > div { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px solid #f0f0f0; font-size: 12.5px; color: #333; }
.webstage .wsm > div > b { flex: 0 0 70px; font-size: 11px; font-weight: 800; color: var(--g); padding-top: 1px; }
.webstage .wsm .lnk { justify-content: flex-start; align-items: center; gap: 22px; border-bottom: 0; padding-top: 12px; font-weight: 800; }
.webstage .wsm .lnk a { font-weight: 800; }
.webstage .wsm .lnk .ghl { display: inline-flex; align-items: center; gap: 6px; }
.webstage .wsm .lnk .ghl svg { width: 15px; height: 15px; }
.slide > .webstage { transition: opacity var(--slow) var(--e) var(--d,0ms), translate var(--slow) var(--e) var(--d,0ms); }
.wrap:not(.in) .slide > .webstage { opacity: 0; translate: 0 var(--rise); }
.ring { position: absolute; width: 22px; height: 22px; border: 1.5px solid var(--g); border-radius: 50%; }
.line-v { position: absolute; width: 0; border-left: 1px solid var(--g); }
.line-h { position: absolute; height: 0; border-top: 1px solid var(--g); }
.doodle { position: absolute; overflow: visible; pointer-events: none; z-index: 1; }
.doodle path { fill: none; stroke: var(--g); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; opacity: .85; transition: stroke-dashoffset 1.1s cubic-bezier(.6,0,.3,1) var(--d,0ms); }
.wrap:not(.in) .doodle path { stroke-dashoffset: 1; }
.doodle.slow path { transition-duration: 2s; }
.doodle.brush path { stroke-width: 4.5; opacity: .8; }
.doodle.thick path { stroke-width: 3.2; opacity: .9; }

.mr { display: flex; gap: 16px; border-top: 1px solid #ddd; padding: 8px 0; font-size: 13px; }
.mr b { width: 56px; font-weight: 700; flex-shrink: 0; }
.hl { margin: 6px 0 14px; padding: 12px 16px; background: #f2f2f2; }
.hl .k { color: #666; margin-top: 0; }
.hl .sm { margin-bottom: 0; font-size: 14.5px; font-weight: 700; line-height: 1.55; color: #111; }
.hl .sub { display: block; margin-top: 7px; font-size: 11.5px; line-height: 1.5; color: #666; }
.rx { word-break: keep-all; }
.rx .k { margin: 15px 0 7px; font-size: 11.5px; }
.rx .hl { margin: 0; padding: 13px 18px; }
.rx .hl .k { margin: 0 0 6px; }
.rx .hl .sm { font-size: 15px; line-height: 1.6; }
.rx .hl .sub { margin-top: 9px; font-size: 12px; color: #555; }
.rx .story5 b { font-size: 14px; }
.rx .story5 span { font-size: 11.5px; color: #444; }
.rx .do { gap: 14px; padding: 5px 0; font-size: 13px; line-height: 1.55; color: #333; }
.rx .do b { flex: 0 0 96px; font-size: 13px; }
.rx .res { margin-top: 0; padding: 9px 14px; border-left: 3px solid var(--g); background: #f6f7ff; font-size: 13px; line-height: 1.6; color: #222; }
.rx .res b { color: var(--g); }
/* 만약에: 강조어만 굵게, 나머지는 한 단계 가볍게 */
.rx.mk .hl .sm { font-weight: 500; color: #333; }
.rx.mk .hl .sm b { font-weight: 800; }
.rx.mk .hl .sub b { font-weight: 800; color: #222; }
.rx.mk .story5 span { font-weight: 400; color: #666; }
.rx.mk .do span { font-weight: 400; color: #555; }
.rx.mk .do span b { font-weight: 800; color: #111; }
.rx.mk .res { font-weight: 400; color: #444; }
.rx.mk .res b { font-weight: 800; }
.story5 { display: flex; margin: 2px 0 12px; }
.story5 > div { flex: 1; position: relative; padding: 10px 8px 0 0; border-top: 2px solid #111; }
.story5 > div::before { content: ''; position: absolute; top: -5px; left: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--g); }
.story5 b { display: block; font-size: 13px; font-weight: 900; color: #111; letter-spacing: -.3px; }
.story5 span { display: block; margin-top: 4px; font-size: 10.5px; line-height: 1.45; color: #666; word-break: keep-all; }
.st3 { display: flex; gap: 18px; margin: 2px 0 4px; }
.st3 > div { flex: 1; border-top: 2px solid #111; padding-top: 8px; }
.st3 b { display: block; font-size: 30px; font-weight: 900; letter-spacing: -1.5px; line-height: 1; color: #111; }
.st3 b small { margin-left: 3px; font-size: 14px; font-weight: 700; letter-spacing: 0; color: #888; }
.st3 span { display: block; margin-top: 6px; font-size: 11px; line-height: 1.4; color: #666; }
/* AI NEWSROOM 오른쪽 본문: 단락 사이 간격을 넉넉하게 */
.ax .st3 { margin-bottom: 14px; }
.ax .st3 span { margin-top: 8px; line-height: 1.5; }
.ax .k { display: block; margin: 28px 0 9px; }
.ax .qa { padding: 10px 0; line-height: 1.55; }
.ax .do { padding: 7px 0; line-height: 1.65; }
.ax .hl { margin-top: 26px; padding: 16px 18px; }
.ax .hl .k { margin: 0 0 8px; }
/* 하단 여백 정리: About · 만약에 · 웹/콘텐츠 무대의 단락 간격 */
.p.cv h4 { margin: 32px 0 8px; }
.p.cv h4:first-child { margin-top: 0; }
.p.cv .tl { padding: 11px 0; }
.rx.mk .k { margin: 21px 0 8px; }
.rx.mk .hl .k { margin: 0 0 7px; }
.rx.mk .hl { padding: 16px 18px; }
.rx.mk .story5 { margin: 2px 0 16px; }
.rx.mk .do { padding: 6px 0; line-height: 1.6; }
.rx.mk .res { padding: 10px 16px; }
.webstage .k { margin: 26px 0 7px; }
.webstage .wsl { padding: 14px 16px; line-height: 1.7; }
.webstage .sm { line-height: 1.7; }
.webstage .wst { margin: 6px 0 14px; }
.webstage .wsm { margin-top: 28px; }
.webstage .wsm > div { padding: 11px 0; }
.webstage .wsm .lnk { padding-top: 16px; }
/* 링크 줄: 위 정보와 같은 왼쪽 선에 맞춘 버튼 모양 */
.p.mv .mr.lnk { justify-content: flex-start; gap: 10px; margin-top: 8px; padding-top: 0; }
.mv .mr.lnk a, .webstage .wsm .lnk a { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 1.5px solid #111; border-radius: 999px; background: #fff; color: #111 !important; font-size: 12.5px; font-weight: 800; line-height: 1; text-decoration: none; transition: background var(--fast), color var(--fast), border-color var(--fast); }
.mv .mr.lnk a:first-child, .webstage .wsm .lnk a:first-child { border-color: var(--g); background: var(--g); color: #fff !important; }
.mv .mr.lnk a:hover, .webstage .wsm .lnk a:hover { border-color: var(--g); color: var(--g) !important; }
.mv .mr.lnk a:first-child:hover, .webstage .wsm .lnk a:first-child:hover { background: #fff; color: var(--g) !important; }
.mv .mr.lnk .ghl svg, .webstage .wsm .lnk .ghl svg { width: 14px; height: 14px; }
.webstage .wsm .lnk { gap: 10px; }
/* 웹 제작 한 줄 소개: 검정 글씨 + 핵심 구절 형광펜 */
.whead { display: flex; align-items: center; gap: 18px; }
.whead .ht { flex: none; font-size: 40px; letter-spacing: -1.5px; line-height: 1; white-space: nowrap; }
.wslead { position: relative; flex: 1; min-width: 0; padding-left: 20px; font-size: 15px; font-weight: 600; line-height: 1.5; color: #333; letter-spacing: -.2px; white-space: nowrap; }
.wslead::before { content: ''; position: absolute; left: 0; top: 50%; width: 2px; height: 26px; background: #111; transform: translateY(-50%); }
.psub { margin-left: 4px; font-weight: 700; color: #444; }
.wslead mark { padding: 0 2px; background: linear-gradient(transparent 58%, color-mix(in srgb, var(--g) 22%, transparent) 58%); color: #111; font-weight: 800; }

// 등장 순서: 모든 장이 같은 역할 순서로 등장한다
const ROLE_DELAY = el =>
  el.matches('.vt, .ht, .lead, .whead') ? 0 :                 // ① 제목
  el.matches('.ph, .vid, .vid-print, .shotslider, .webstage') ? 120 :         // ② 사진 · 영상
  el.matches('.ring, .line-h, .line-v') ? 500 :       // ⑤ 장식
  240;                                                 // ③ 본문
deck.querySelectorAll('.slide').forEach(sl => {
  [...sl.children].forEach(el => el.style.setProperty('--d', ROLE_DELAY(el) + 'ms'));
  sl.querySelectorAll('.row, .tl, .mr').forEach((r, k) => r.style.setProperty('--d', (360 + Math.min(k, 5) * 50) + 'ms'));   // ④ 표 줄
});

// 화면 슬라이더: ‹ › 버튼 · 점 · 3.5초 자동 넘김(마우스를 올리면 멈춤, 장이 보일 때만)
deck.querySelectorAll('.shotslider').forEach(sl => {
  const imgs = [...sl.querySelectorAll('.ss-view img')], dots = [...sl.querySelectorAll('.ss-dots i')];
  const cap = sl.querySelector('.ss-cap'), caps = JSON.parse(sl.dataset.caps);
  let i = 0, timer = null, hover = false;
  const go = n => { i = (n + imgs.length) % imgs.length; imgs.forEach((im, k) => im.classList.toggle('on', k === i)); dots.forEach((d, k) => d.classList.toggle('on', k === i)); cap.textContent = caps[i]; };
  const stop = () => { clearInterval(timer); timer = null; };
  const start = () => { stop(); if (!hover) timer = setInterval(() => go(i + 1), 3500); };
  sl.querySelector('.prev').addEventListener('click', e => { e.stopPropagation(); go(i - 1); start(); });
  sl.querySelector('.next').addEventListener('click', e => { e.stopPropagation(); go(i + 1); start(); });
  dots.forEach((d, k) => d.addEventListener('click', e => { e.stopPropagation(); go(k); start(); }));
  sl.addEventListener('mouseenter', () => { hover = true; stop(); });
  sl.addEventListener('mouseleave', () => { hover = false; if (sl.closest('.wrap').classList.contains('in')) start(); });
  sl._start = start; sl._stop = stop; go(0);
});

// 웹 제작 무대: 3.5초마다 다음 사이트로, 미리보기 클릭으로 이동, 마우스를 올리면 멈춤
deck.querySelectorAll('.webstage').forEach(ws => {
  const imgs = [...ws.querySelectorAll('.ws-img')], ths = [...ws.querySelectorAll('.ws-th')], infos = [...ws.querySelectorAll('.wsi')];
  const T_MS = 3500; ws.style.setProperty('--ws-t', T_MS + 'ms');
  let i = 0, timer = null, hover = false;
  const go = n => {
    i = (n + imgs.length) % imgs.length;
    [imgs, infos].forEach(arr => arr.forEach((el, k) => el.classList.toggle('on', k === i)));
    ths.forEach((t, k) => { t.classList.toggle('on', k === i); t.classList.toggle('next', k === (i + 1) % ths.length); const bar = t.querySelector('i'); bar.style.animation = 'none'; bar.offsetWidth; bar.style.animation = ''; });
  };
  const stop = () => { clearInterval(timer); timer = null; };
  const start = () => { stop(); if (!hover) timer = setInterval(() => go(i + 1), T_MS); };
  ths.forEach((t, k) => t.addEventListener('click', e => { e.stopPropagation(); go(k); start(); }));
  ws.addEventListener('mouseenter', () => { hover = true; ws.classList.add('paused'); stop(); });
  ws.addEventListener('mouseleave', () => { hover = false; ws.classList.remove('paused'); if (ws.closest('.wrap').classList.contains('in')) { go(i); start(); } });
  ws._start = () => { go(i); start(); }; ws._stop = stop; go(0);
});

    return [{ g: pi === 0 ? 'PROJECTS' : null, n: p.n, t: p.short || p.name }, ...subs.map(x => ({ t: x, sub: true }))];
  }),
  { g: 'OUTRO', t: 'Thank you' }
];
const sdnav = document.getElementById('sdnav');
sdnav.innerHTML = sdItems.map((it, i) => (it.g ? `<h6>${it.g}</h6>` : '') + `<a href="#s${i + 1}"${it.sub ? ' class="sub"' : ''}>${it.n ? `<span class="n">${it.n}</span>` : ''}<span>${it.t}</span></a>`).join('');
const sdLinks = sdnav.querySelectorAll('a');
const sdBar = document.getElementById('sdbar'), sdNum = document.getElementById('sdnum');
sdLinks.forEach(a => a.addEventListener('click', () => document.body.classList.remove('sd-open')));
document.getElementById('sdtoggle').addEventListener('click', () => document.body.classList.toggle('sd-open'));
function sdMark(idx) {
  sdLinks.forEach((a, i) => a.classList.toggle('on', i === idx));
  const tot = sdLinks.length;
  sdBar.style.width = ((idx + 1) / tot * 100) + '%';
  sdNum.textContent = `${String(idx + 1).padStart(2, '0')} / ${String(tot).padStart(2, '0')}`;
  sdLinks[idx]?.scrollIntoView({ block: 'nearest' });
}

// 슬라이드 진입 시 .in → 모션 재생 (다시 돌아오면 다시 재생)
const wraps = deck.querySelectorAll('.wrap');
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting && e.target.classList.contains('in')) e.target.classList.add('seen');
  e.target.classList.toggle('in', e.isIntersecting);
  e.target.querySelectorAll('video').forEach(v => { if (e.isIntersecting) v.play().catch(() => {}); else v.pause(); });
  e.target.querySelectorAll('.shotslider').forEach(sl => e.isIntersecting ? sl._start() : sl._stop());
  e.target.querySelectorAll('.webstage').forEach(ws => e.isIntersecting ? ws._start() : ws._stop());
  if (e.isIntersecting) {
    const idx = [...wraps].indexOf(e.target);
    dotLinks.forEach((d, i) => d.classList.toggle('on', i === idx));
    sdMark(idx);
  }
}), { threshold: 0.55 });
wraps.forEach(w => io.observe(w));

// 스크롤 진행 바 · 패럴랙스
const bar = document.getElementById('progress');
let ticking = false;
function onScroll() {
  const vh = innerHeight;
  const max = document.documentElement.scrollHeight - vh;
  bar.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
  wraps.forEach(w => {
    const r = w.getBoundingClientRect();
    if (r.bottom < -50 || r.top > vh + 50) return;
    w.style.setProperty('--p', Math.max(0, Math.min(1, (vh - r.top) / (vh + r.height))).toFixed(3));
  });
  ticking = false;
}
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });

function fit() {
  const sw = window.innerWidth > 900 ? 210 : 0;   // 사이드바 폭을 빼고 맞춘다
  const s = Math.min((window.innerWidth - sw) / 1280, window.innerHeight / 720);
  document.documentElement.style.setProperty('--s', s);
  onScroll();
}
fit();
window.addEventListener('resize', fit);
// 인쇄 · PDF: 영상 대신 대표 장면(포스터) 사진을 넣는다(재생 버튼 · 진행 막대가 찍히지 않게)
function swapVideos(toPrint) {
  deck.querySelectorAll('video.vid').forEach(v => {
    let im = v.nextElementSibling && v.nextElementSibling.classList.contains('vid-print') ? v.nextElementSibling : null;
    if (toPrint) {
      if (!im) { im = document.createElement('img'); im.className = 'vid-print a'; im.src = v.poster; im.style.cssText = v.style.cssText + ';object-fit:cover;border-radius:6px'; v.after(im); }
      v.style.display = 'none'; im.style.display = 'block';
    } else if (im) { im.style.display = 'none'; v.style.display = ''; }
  });
}
window.addEventListener('beforeprint', () => { document.documentElement.style.setProperty('--s', 1); swapVideos(true); });
window.addEventListener('afterprint', () => { swapVideos(false); fit(); });

// 글 상자는 바로 수정할 수 있게 편집 가능 상태라, 안의 링크는 눌러도 이동하지 않는다 → 직접 새 탭으로 연다
deck.addEventListener('click', e => {
  const a = e.target.closest('a[href]');
  if (!a || !/^https?:/i.test(a.href) || e.defaultPrevented) return;
  e.preventDefault();
  window.open(a.href, '_blank', 'noopener');
}, true);
const pick = document.getElementById('pick');
let target = null;
deck.addEventListener('click', e => {
  const ph = e.target.closest('.ph');
  if (ph) { target = ph; pick.click(); }
});
pick.addEventListener('change', () => {
  const f = pick.files[0];
  if (!f || !target) return;
  const r = new FileReader();
  r.onload = () => {
    target.style.backgroundImage = `url(${r.result})`;
    target.classList.add('has-img');
    pick.value = '';
  };
  r.readAsDataURL(f);
});
</script>
</body>
